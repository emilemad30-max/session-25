<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <h2>Register Form</h2>
        <form id="register">
            <div>
                <input id="namee" type="text" placeholder="Your Name">
            </div>
            <div>
                <input id="emaill" type="email" placeholder="Your Email">
            </div>
            <div>
                <input id="passwordd" type="password" placeholder="Your Password">
            </div>
            <div>
                <input id="submit" type="submit">
            </div>
        </form>
    </div>




    <script src="script.js"></script>
</body>
</html>
